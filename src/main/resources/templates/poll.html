<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Servlet will replace these with dynamic content -->
    <h1 id="poll-question"></h1>

    <h3>Options</h3>
    <form action="PollServlet" method="post" id="vote-form">
        <input type="hidden" name="id" id="poll-id">
        <div id="options"></div>
        <button type="submit" class="btn btn-primary mt-2">Vote</button>
    </form>

    <h3>Comments</h3>
    <ul class="list-group mb-3" id="comments"></ul>

    <form action="PollServlet" method="post" id="comment-form">
        <input type="hidden" name="id" id="comment-poll-id">
        <textarea name="comment" class="form-control mb-2" placeholder="Add a comment"></textarea>
        <button type="submit" class="btn btn-primary">Add Comment</button>
    </form>
</div>
</body>
</html>
