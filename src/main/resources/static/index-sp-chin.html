<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络应用程式：设计与开发</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .container {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .list-group {
            list-style: none;
            padding: 0;
        }
        .list-group-item {
            padding: 10px 15px;
            margin-bottom: 5px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .list-group-item a {
            text-decoration: none;
            color: #3498db;
        }
        .list-group-item a:hover {
            text-decoration: underline;
        }
        .action-links {
            margin: 15px 0;
        }
        .action-links a {
            display: inline-block;
            margin-right: 15px;
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .action-links a:hover {
            background-color: #2980b9;
        }
        .language-switcher {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
<header>
    <h1>网络应用程式：设计与开发</h1>
</header>

<section>
    <h2>课堂:</h2>
    <ul class="list-group">
        <li class="list-group-item">L1</li>
        <li class="list-group-item">L2</li>
        <li class="list-group-item">L3</li>
        <li class="list-group-item">L4</li>
    </ul>
</section>

<div class="action-links">
    <a href="/login">登入</a>
    <a href="/register">注册</a>
</div>

<div class="container">
    <h2>投票</h2>
    <div class="action-links">
        <a href="/polls">投票</a>
        <a href="/polls/new">创建投票</a>
    </div>
    <ul class="list-group">
        <li th:each="投票 : ${polls}" class="list-group-item">
            <a th:href="@{/polls/{id}(id=${poll.id})}" th:text="${poll.question}"></a>
        </li>
    </ul>
</div>


<div class="language-switcher">
    <p>选择语言:</p>
    <a href="/index-chin.html">繁體中文 (Traditional Chinese)</a> |
    <a href="/index.html">English</a>
</div>
</body>
</html>
